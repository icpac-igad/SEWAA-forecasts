services:
  web: &cgan_web
    build:
      context: .
      args:
        - WORK_HOME=${CTNR_WORK_HOME:-/opt/cgan}
    image: ${IMG_PREFIX:-icpac/sewaa-}cgan-v2
    container_name: ${WEB_CNTR_NAME:-cgan-web}
    volumes:
      - ${cGAN_6h_FORECASTS_DIR:-./6h_accumulations/cGAN_forecasts}:${CTNR_WORK_HOME:-/opt/cgan}/6h_accumulations/cGAN_forecasts
      - ${IFS_6h_FORECASTS_DIR:-./6h_accumulations/IFS_forecast_data}:${CTNR_WORK_HOME:-/opt/cgan}/6h_accumulations/IFS_forecast_data
      - ${cGAN_24h_FORECASTS_DIR:-./24h_accumulations/cGAN_forecasts}:${CTNR_WORK_HOME:-/opt/cgan}/24h_accumulations/cGAN_forecasts
      - ${IFS_24h_FORECASTS_DIR:-./24h_accumulations/IFS_forecast_data}:${CTNR_WORK_HOME:-/opt/cgan}/24h_accumulations/IFS_forecast_data
      - ${COUNTS_DATA_DIR:-./interface/data}:${CTNR_WORK_HOME:-/opt/cgan}interface/data
      - ${SSH_AUTH_KEYS:-${HOME}/.ssh}:${CTNR_WORK_HOME:-/opt/cgan}/.ssh
    ports:
      - ${HOST_IP:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${HOST_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443

  jobs:
    <<: *cgan_web
    image: ${IMG_PREFIX:-icpac/sewaa-}cgan-v2
    container_name: ${JOBS_CNTR_NAME:-cgan-jobs}
    command: ["python", "start_forecasting.py"]
    # not used but must be specified to prevent conflicts with web service
    ports:
      - ${HOST_IP:-0.0.0.0}:${HTTP_PORT:-8180}:80
      - ${HOST_IP:-0.0.0.0}:${HTTPS_PORT:-4143}:443
