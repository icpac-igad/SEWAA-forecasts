user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/notice.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_comp_level 6;

    client_max_body_size 4G;
    client_body_buffer_size 100M;

    large_client_header_buffers 16 2048k;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # log to file
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log error;

    # direct logs to stdout
    access_log /dev/stdout main;
    error_log /dev/stderr error;
    error_log /dev/stderr info;
    error_log /dev/stderr warn;

    server {
        listen       80;
        server_name  _;

        location /static/ {
            alias /opt/interface/static/;
        }

        # Viz-ready data, one tree per dataset (${STORE}/interface/<dataset>, or the
        # interface/<dataset> prefixes of the data bucket on Cloud Run). Public and readable
        # cross-origin. IMERG stays at the root: /data/counts_6h/, /data/counts_24h/, ...
        location /data/ {
            alias /opt/interface/counts/;
            add_header Access-Control-Allow-Origin * always;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime off;
            autoindex_format html;
        }

        location /data/rfe/ {
            alias /opt/interface/rfe-counts/;
            add_header Access-Control-Allow-Origin * always;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime off;
            autoindex_format html;
        }

        location /data/chirps/ {
            alias /opt/interface/chirps-counts/;
            add_header Access-Control-Allow-Origin * always;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime off;
            autoindex_format html;
        }

        location /forecasts/ {
            alias /opt/interface/forecasts/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime off;
            autoindex_format html;
        }

        # `location /`: proxy to the FastAPI interface when WEB_UPSTREAM is set
        # (docker-compose), 404 otherwise (Cloud Run data portal). Written at container
        # start by /docker-entrypoint.d/40-web-proxy.sh.
        include /etc/nginx/snippets/web-proxy.conf;

        # redirect server error pages to the static page /50x.html
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

    }

}