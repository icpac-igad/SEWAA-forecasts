# Cloud Build config: builds the unified cgan-forecasts image once, then deploys it as
# four Cloud Run Jobs — one per forecast "channel" (dataset + accumulation): imerg-6h,
# imerg-24h, rfe-24h, chirps-24h. All four run the exact same image; CGAN_DATASET is a
# runtime env var (dataset_config.py), not a build arg, so a single build serves all four
# jobs plus the data-portal nginx image (see nginx.Dockerfile, not built here — it has no
# dataset-specific behavior and rarely changes).
#
# Each job runs `auto_forecasts.py --dataset <name> --accumulation <accum>` once and exits
# (catch-up over the last `--days_to_check` days, idempotent via run_forecast.py's own
# counts-file check). One job per channel — rather than one job per dataset running both
# of IMERG's accumulations, or start_forecasting.py's single-process, sequential polling
# loop — means a slow/stuck run on one channel never delays or queues behind another.
# Cloud Scheduler re-triggers each job on a cron (see deploy/setup-cloud-scheduler.sh) —
# the standard serverless replacement for an always-on polling container, and it avoids
# paying for 24/7 idle CPU.
#
# For a docker-compose / always-on deployment, the jobs/jobs-rfe/jobs-chirps services in
# docker-compose.yml still run start_forecasting.py's continuous polling loop instead —
# this file is specifically the Cloud Run Jobs path.
#
# Required substitutions (pass via --substitutions or a trigger's substitution config):
#   _REGION              e.g. europe-west1 (matches the existing icpac-data-portal region)
#   _FORECAST_DATA_BUCKET  GCS bucket the jobs write viz-ready data + accumulations into.
#                        NOTE: confirm this against whoever owns the existing
#                        icpac-data-portal Cloud Run service before first deploy — its
#                        source isn't in this repo, so this plan can't confirm whether it
#                        already reads from a specific bucket/prefix layout.
#
# CPU/RAM defaults below (4 vCPU / 8 GiB, 1h timeout) are a starting point sized for CPU-only
# TensorFlow 2.15 inference (pyproject.toml, no CUDA in Dockerfile) over a 7-member 24h
# ensemble (run_forecast.py) — tune from Cloud Monitoring after the first week of real runs.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  - id: build-nginx
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "nginx.Dockerfile", "-t", "${_NGINX_IMAGE}", "."]

  - id: push-nginx
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_NGINX_IMAGE}"]

  - id: deploy-jobs-imerg-6h
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - cgan-jobs-imerg-6h
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --set-env-vars=CGAN_DATASET=imerg
      # Higher than the other channels' 4 vCPU / 8Gi: this one runs forecast_date.py's whole
      # 4-lead-time loop (30/36/42/48h) in a single process at ensemble_members: 1000
      # (6h_accumulations/cGAN/dsrnngan/forecast.yaml, kept at 1000 by design), so
      # gen.predict()'s known per-call memory growth (plain Python loop, no
      # tf.function/batching) compounds across all 4x1000 calls before the process exits --
      # this channel OOM'd in production at 8Gi. Cloud Run ties max memory to vCPU count, so
      # --cpu is raised alongside --memory here, not just the memory figure.
      - --cpu=8
      - --memory=32Gi
      - --task-timeout=3600s
      - --max-retries=1
      - --tasks=1
      - --parallelism=1
      - --command=python
      - --args=auto_forecasts.py,--dataset,imerg,--accumulation,6h
      - --add-volume=name=viz-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/imerg
      - --add-volume-mount=volume=viz-data,mount-path=/opt/cgan/interface/data
      - --add-volume=name=cgan-forecasts-6h-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/imerg/6h/cGAN_forecasts
      - --add-volume-mount=volume=cgan-forecasts-6h-vol,mount-path=/opt/cgan/6h_accumulations/cGAN_forecasts
      - --add-volume=name=ifs-6h-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/imerg/6h/IFS_forecast_data
      - --add-volume-mount=volume=ifs-6h-vol,mount-path=/opt/cgan/6h_accumulations/IFS_forecast_data

  - id: deploy-jobs-imerg-24h
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - cgan-jobs-imerg-24h
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --set-env-vars=CGAN_DATASET=imerg
      - --cpu=4
      - --memory=8Gi
      - --task-timeout=3600s
      - --max-retries=1
      - --tasks=1
      - --parallelism=1
      - --command=python
      - --args=auto_forecasts.py,--dataset,imerg,--accumulation,24h
      - --add-volume=name=viz-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/imerg
      - --add-volume-mount=volume=viz-data,mount-path=/opt/cgan/interface/data
      - --add-volume=name=cgan-forecasts-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/imerg/24h/cGAN_forecasts
      - --add-volume-mount=volume=cgan-forecasts-vol,mount-path=/opt/cgan/24h_accumulations/cGAN_forecasts
      - --add-volume=name=ifs-24h-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/imerg/24h/IFS_forecast_data
      - --add-volume-mount=volume=ifs-24h-vol,mount-path=/opt/cgan/24h_accumulations/IFS_forecast_data

  - id: deploy-jobs-rfe-24h
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - cgan-jobs-rfe-24h
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --set-env-vars=CGAN_DATASET=rfe
      - --cpu=4
      - --memory=8Gi
      - --task-timeout=3600s
      - --max-retries=1
      - --tasks=1
      - --parallelism=1
      - --command=python
      - --args=auto_forecasts.py,--dataset,rfe,--accumulation,24h
      - --add-volume=name=viz-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/rfe
      - --add-volume-mount=volume=viz-data,mount-path=/opt/cgan/interface/data
      - --add-volume=name=cgan-forecasts-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/rfe/24h/cGAN_forecasts
      - --add-volume-mount=volume=cgan-forecasts-vol,mount-path=/opt/cgan/24h_accumulations/cGAN_forecasts
      - --add-volume=name=ifs-24h-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/rfe/24h/IFS_forecast_data
      - --add-volume-mount=volume=ifs-24h-vol,mount-path=/opt/cgan/24h_accumulations/IFS_forecast_data

  - id: deploy-jobs-chirps-24h
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - cgan-jobs-chirps-24h
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --set-env-vars=CGAN_DATASET=chirps
      - --cpu=4
      - --memory=8Gi
      - --task-timeout=3600s
      - --max-retries=1
      - --tasks=1
      - --parallelism=1
      - --command=python
      - --args=auto_forecasts.py,--dataset,chirps,--accumulation,24h
      - --add-volume=name=viz-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/chirps
      - --add-volume-mount=volume=viz-data,mount-path=/opt/cgan/interface/data
      - --add-volume=name=cgan-forecasts-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/chirps/24h/cGAN_forecasts
      - --add-volume-mount=volume=cgan-forecasts-vol,mount-path=/opt/cgan/24h_accumulations/cGAN_forecasts
      - --add-volume=name=ifs-24h-vol,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=forecasts/chirps/24h/IFS_forecast_data
      - --add-volume-mount=volume=ifs-24h-vol,mount-path=/opt/cgan/24h_accumulations/IFS_forecast_data

  - id: deploy-data-portal
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cgan-data-portal
      - --image=${_NGINX_IMAGE}
      - --region=${_REGION}
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --allow-unauthenticated
      - --add-volume=name=imerg-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/imerg,ro
      - --add-volume-mount=volume=imerg-data,mount-path=/opt/interface/counts
      - --add-volume=name=rfe-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/rfe,ro
      - --add-volume-mount=volume=rfe-data,mount-path=/opt/interface/rfe-counts
      - --add-volume=name=chirps-data,type=cloud-storage,bucket=${_FORECAST_DATA_BUCKET},mount-options=only-dir=interface/chirps,ro
      - --add-volume-mount=volume=chirps-data,mount-path=/opt/interface/chirps-counts

images:
  - ${_IMAGE}
  - ${_NGINX_IMAGE}

substitutions:
  _REGION: europe-west1
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cgan/cgan-v2:${SHORT_SHA}
  _NGINX_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cgan/cgan-proxy-server:${SHORT_SHA}
  _FORECAST_DATA_BUCKET: CHANGEME-forecast-data-bucket

options:
  logging: CLOUD_LOGGING_ONLY
