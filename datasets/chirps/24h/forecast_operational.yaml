# CHIRPS run07 operational config. Paths are relative to dsrnngan/.
# MODEL/constants/normalisation point into datasets/chirps/ rather than the shared
# 24h_accumulations/cGAN/ tree, which only carries IMERG's model + normalisation assets.
MODEL:
    folder: ../../../datasets/chirps/24h/logs_CHIRPS_run07
    checkpoint: 204800
    include_cape: False
    field_set: run07             # 14 fields (climatology + 13 IFS) = 28 channels

INPUT:
    format:               operational
    fcst_folder:          ../../IFS_forecast_data
    truth_folder:         ""
    constants_folder:     ../../../datasets/chirps/cGAN_data
    normalisation_folder: ../../../datasets/chirps/24h

PERIOD:
    start: 20260903
    end:   20260903

OUTPUT:
    folder: ../fcst_run07_operational
    ensemble_members: 50
    save_crps_only: False
    histogram_folder: ../../../interface/data/counts_24h
