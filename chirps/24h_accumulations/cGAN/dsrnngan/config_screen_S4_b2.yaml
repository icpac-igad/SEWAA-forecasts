GENERAL:
    mode: "GAN"  # choices 'GAN', 'VAEGAN', 'det'
    problem_type: "normal"  # choices 'normal' (forecast to truth), 'autocoarsen' (coarsened truth to truth)

MODEL:
    architecture: "forceconv"  # choices 'normal', 'forceconv', 'forceconv-long'
    padding: "reflect"  # convolution padding: 'same', 'reflect', or 'symmetric'

SETUP:
    log_folder: "../logs_RFE2_S4_b2"   # SCREEN S4: batch sweep, batch=2 (slowest)

GENERATOR:
    filters_gen: 64
    noise_channels: 4
    latent_variables: 50
    learning_rate_gen: 1e-5

DISCRIMINATOR:
    filters_disc: 256
    learning_rate_disc: 1e-5

TRAIN:
    train_years: [2018, 2019, 2020, 2021]
    training_weights: [0.4, 0.3, 0.2, 0.1]
    num_samples: 20480          # SCREEN scale (1/10 of full)
    steps_per_checkpoint: 128
    batch_size: 2               # SCREEN S4 lever = batch 2
    kl_weight: 1e-8
    ensemble_size: 8
    CL_type: "ensmeanMSE"
    content_loss_weight: 1000.0

VAL:
    val_years: [2020]
    val_size: 8

EVAL:
    num_batches: 25
    add_postprocessing_noise: True
    postprocessing_noise_factor: 1e-3
    max_pooling: True
    avg_pooling: True
