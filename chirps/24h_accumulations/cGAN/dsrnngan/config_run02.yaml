## CHIRPS run02 -- same as run01 except the field set: dropped 'cape', added
## 'climatology' (CHIRPS truth climatology mean/sd, see
## scripts/make_climatology_field.py and dsrnngan/data.py). Channel count is
## unchanged at 14 fields x 2 channels = 28. Model/training hyperparameters
## are untouched -- this is a field-set experiment, not an architecture one.

GENERAL:
    mode: "GAN"  # choices 'GAN', 'VAEGAN', 'det'
    problem_type: "normal"  # choices 'normal' (forecast to truth), 'autocoarsen' (coarsened truth to truth)

MODEL:
    architecture: "forceconv"  # choices 'normal', 'forceconv', 'forceconv-long'
    padding: "reflect"  # convolution padding: 'same', 'reflect', or 'symmetric'

SETUP:
    log_folder: "../logs_CHIRPS_run02"
    trackio_project: "sewaa-cgan-chirps"  # separate from RFE2: the two CRPS scales are not comparable

GENERATOR:
    filters_gen: 64  # RFE2 sweet spot; 128 gave only marginal gains for ~4x cost
    noise_channels: 4  # only used for GAN
    latent_variables: 50  # latent variables per pixel; only used for VAEGAN
    learning_rate_gen: 1e-5  # if training blows up, decrease this

DISCRIMINATOR:
    filters_disc: 256  # RFE2 sweet spot
    learning_rate_disc: 1e-5  # if training blows up, decrease this

TRAIN:
    train_years: [2018, 2019, 2020]  # 2021 held out for validation
    training_weights: [0.4, 0.3, 0.2, 0.1]  # frequency to sample from each rain bin
    num_samples: 204800  # full run, ~24h on the RTX 5000
    steps_per_checkpoint: 128
    batch_size: 8  # CRPS is batch-invariant -- use the largest that fits (8 at 64/256)
    kl_weight: 1e-8  # used for VAEGAN
    ensemble_size: 8
    CL_type: "ensmeanMSE"  # 'CRPS', 'CRPS_phys', 'ensmeanMSE', 'ensmeanMSE_phys'
    content_loss_weight: 1000.0  # 1000 for ensmeanMSE, 100 for CRPS

VAL:
    val_years: [2021]  # held out -- never trained on, so this CRPS is a real skill number
    val_size: 8

EVAL:
    num_batches: 25
    add_postprocessing_noise: True
    postprocessing_noise_factor: 1e-3
    max_pooling: True
    avg_pooling: True
