## CHIRPS run05 -- COMBINE the two independent heavy-rain levers:
##   run03's 15-field set (cape + climatology, 30 channels)
##   run04's heavy-tilted training_weights [0.1, 0.2, 0.3, 0.4]
## Everything else is byte-identical to run03/run04, so run05 vs run04 isolates
## cape and run05 vs run03 isolates the reweight.
##
## Why: both levers improved heavy-rain area bias at >=50 mm over run02 (0.20)
## -- cape to 0.32 (run03), reweighting to 0.28 (run04) -- and neither cost
## anything on mean CRPS (all three within 0.4%). Neither closed the ~3.5x
## under-production of >=50 mm area. This run asks whether they add.
##
## JUDGE ON THE TAIL, NOT THE MEAN. Mean CRPS will land ~0.0464 and say nothing.
## The numbers that matter are area bias @ >=50 and FSS@64px: additive levers
## would give ~0.40+, redundant ones ~0.30. Either answer is informative.
##
## The denormalise cap (100) is the OTHER tail lever and is deliberately NOT
## touched here -- it changes the output scale and would break comparability
## with run02/03/04, making an additivity read impossible. That is run06.
##
## Requires: data.py all_fcst_fields includes 'cape' AND 'climatology';
## FCSTNorm2018.pkl carries 15 keys (already the merged superset);
## data_paths.yaml tfrecords_path -> /home/ezra/chirps_tfrecords/run03/.
## scripts/preflight.py --config config_run05.yaml --expect-fields 15 checks all
## three, including the actual channel count in the tfrecords on disk.

GENERAL:
    mode: "GAN"  # choices 'GAN', 'VAEGAN', 'det'
    problem_type: "normal"  # choices 'normal' (forecast to truth), 'autocoarsen' (coarsened truth to truth)

MODEL:
    architecture: "forceconv"  # choices 'normal', 'forceconv', 'forceconv-long'
    padding: "reflect"  # convolution padding: 'same', 'reflect', or 'symmetric'

SETUP:
    log_folder: "../logs_CHIRPS_run05"
    trackio_project: "sewaa-cgan-chirps"  # separate from RFE2: the two CRPS scales are not comparable

GENERATOR:
    filters_gen: 64  # RFE2 sweet spot; 128 gave only marginal gains for ~4x cost
    noise_channels: 4  # only used for GAN
    latent_variables: 50  # latent variables per pixel; only used for VAEGAN
    learning_rate_gen: 1e-5  # if training blows up, decrease this

DISCRIMINATOR:
    filters_disc: 256  # RFE2 sweet spot
    learning_rate_disc: 1e-5  # if training blows up, decrease this

TRAIN:
    train_years: [2018, 2019, 2020]  # 2021 held out for validation
    training_weights: [0.1, 0.2, 0.3, 0.4]  # HEAVY-tilted (run04's), vs run02/run03's dry-tilted
                                            # [0.4,0.3,0.2,0.1]. Bins [0.0082,0.0439,0.1234] are
                                            # truth-derived and baked into the tfrecords -- this
                                            # is read by the DataGenerator at train time, so it
                                            # needs no tfrecords or FCSTNorm rebuild.
    num_samples: 204800  # full run, ~24h on the RTX 5000
    steps_per_checkpoint: 128
    batch_size: 8  # CRPS is batch-invariant -- use the largest that fits (8 at 64/256)
    kl_weight: 1e-8  # used for VAEGAN
    ensemble_size: 8
    CL_type: "ensmeanMSE"  # 'CRPS', 'CRPS_phys', 'ensmeanMSE', 'ensmeanMSE_phys'
    content_loss_weight: 1000.0  # 1000 for ensmeanMSE, 100 for CRPS

VAL:
    val_years: [2021]  # held out -- never trained on, so this CRPS is a real skill number
    val_size: 8

EVAL:
    num_batches: 25  # 25 IMAGES, not batches -- see the runbook's comparability warning
    add_postprocessing_noise: True
    postprocessing_noise_factor: 1e-3
    max_pooling: True
    avg_pooling: True
