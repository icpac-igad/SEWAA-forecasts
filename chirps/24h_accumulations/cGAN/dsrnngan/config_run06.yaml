## CHIRPS run06 -- improve run04 (heavy-reweight, NO cape) with a 5th EXTREME rain bin.
## run04 oversampled the top QUARTILE ([0.1,0.2,0.3,0.4] over 4 bins), but that top bin
## lumps moderate-heavy (>3 mm/day patch-mean) with true extremes, so the >=50 mm/day
## gap only narrowed to area-bias 0.28. run06 SPLITS the top quartile: a 5th bin at the
## 95th percentile of the 128x128 patch-mean (0.2813 mm/hr ~= 6.8 mm/day; compute_chirps_
## bins_run06.py) isolates the wettest 5% of patches -- the ones carrying the >=50 mm/day
## cells -- and oversamples THEM specifically.
## Field set: run02/run04's 14 fields, NO cape (28 ch). REQUIRES a tfrecords REBUILD
## (5-class re-tag) to /home/ezra/chirps_tfrecords/run06/ and FCSTNorm2018_run02_14field_clim.
## Hypothesis: >=50 area-bias past run04's 0.28 toward run05's cape-driven 0.47, WITHOUT cape.
## RISK: extreme bin is only 5% of patches; at weight 0.5 it is seen ~10x its natural rate --
## if common days degrade, back off to [0.1,0.15,0.2,0.25,0.3]. Judge on TAIL (area bias
## @>=50, FSS@64), not mean CRPS.

GENERAL:
    mode: "GAN"  # choices 'GAN', 'VAEGAN', 'det'
    problem_type: "normal"  # choices 'normal' (forecast to truth), 'autocoarsen' (coarsened truth to truth)

MODEL:
    architecture: "forceconv"  # choices 'normal', 'forceconv', 'forceconv-long'
    padding: "reflect"  # convolution padding: 'same', 'reflect', or 'symmetric'

SETUP:
    log_folder: "../logs_CHIRPS_run06"
    trackio_project: "sewaa-cgan-chirps"  # separate from RFE2: the two CRPS scales are not comparable

GENERATOR:
    filters_gen: 64  # RFE2 sweet spot; 128 gave only marginal gains for ~4x cost
    noise_channels: 4  # only used for GAN
    latent_variables: 50  # latent variables per pixel; only used for VAEGAN
    learning_rate_gen: 1e-5  # if training blows up, decrease this

DISCRIMINATOR:
    filters_disc: 256  # RFE2 sweet spot
    learning_rate_disc: 1e-5  # if training blows up, decrease this

TRAIN:
    train_years: [2018, 2019, 2020]  # 2021 held out for validation
    training_weights: [0.05, 0.1, 0.15, 0.2, 0.5]  # run06: 5 bins, HALF the batches from the EXTREME (top-5%) bin
    num_samples: 204800  # full run, ~24h on the RTX 5000
    steps_per_checkpoint: 128
    batch_size: 8  # CRPS is batch-invariant -- use the largest that fits (8 at 64/256)
    kl_weight: 1e-8  # used for VAEGAN
    ensemble_size: 8
    CL_type: "ensmeanMSE"  # 'CRPS', 'CRPS_phys', 'ensmeanMSE', 'ensmeanMSE_phys'
    content_loss_weight: 1000.0  # 1000 for ensmeanMSE, 100 for CRPS

VAL:
    val_years: [2021]  # held out -- never trained on, so this CRPS is a real skill number
    val_size: 8

EVAL:
    num_batches: 25
    add_postprocessing_noise: True
    postprocessing_noise_factor: 1e-3
    max_pooling: True
    avg_pooling: True
